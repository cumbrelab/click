  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);

p;\n  src: url(\"f7f80ce3-87c3-4ec6-abb5-3e2843debed4\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* Family tokens */\n  --font-display: \"Nunito\", \"Garet\", system-ui, sans-serif; /* Garet Bold stand-in */\n  --font-body: \"Alata\", system-ui, sans-serif;\n  --font-mono: ui-monospace, \"SF Mono\", Menlo, monospace;\n}\n\n/* ============================================================\n   COLORS — CumbreLab\n   \"Tonos oscuros y profundos que evocan la noche en la montaña,\n    con el verde menta como único acento de energía y acción.\"\n   Usage proportion 50 / 30 / 20: dark / neutral+slate / green.\n   ============================================================ */\n:root {\n  /* ---- Base palette (raw brand colors) ---- */\n  --cl-green:  #A8FFB0; /* Verde Cumbre — primary accent, CTAs, highlights */\n  --cl-night:  #0E121A; /* Noche — main background */\n  --cl-slate:  #2A333B; /* Pizarra — cards, secondary surfaces */\n  --cl-mid:    #717279; /* Grafito — secondary text, icons, labels */\n  --cl-pearl:  #AFB2B4; /* Perla — body text on dark, isotype */\n  --cl-white:  #FFFFFF;\n\n  /* Green tints (derived; used for capsules, overlays, accents) */\n  --cl-green-12: rgba(168, 255, 176, 0.12);\n  --cl-green-20: rgba(168, 255, 176, 0.20);\n  --cl-green-08: rgba(168, 255, 176, 0.08);\n  --cl-green-deep: #2D4A30; /* solid dark-green pill bg (proposals) */\n\n  /* Slightly cooler night used on long-form proposals/landing */\n  --cl-night-2: #0E1520;\n  --cl-slate-2: #17202E;\n\n  /* Semantic / state */\n  --cl-danger: #FF6B6B; /* \"incorrecto\" / error / prohibited */\n  --cl-warning: #F0C060; /* gold — accents in proposals */\n  --cl-success: var(--cl-green);\n\n  /* ---- Hairlines & scrims on dark ---- */\n  --cl-border:        rgba(255, 255, 255, 0.07);\n  --cl-border-strong: rgba(255, 255, 255, 0.12);\n  --cl-overlay-night: rgba(14, 18, 26, 0.70); /* text-over-photo scrim 60–75% */\n  --cl-overlay-green: rgba(168, 255, 176, 0.12); /* brand tint over photo 10–15% */\n\n  /* ============================================================\n     SEMANTIC ALIASES — prefer these in components\n     ============================================================ */\n  /* Surfaces */\n  --surface-page:    var(--cl-night);\n  --surface-card:    var(--cl-slate);\n  --surface-subtle:  rgba(255, 255, 255, 0.03); /* card-dark */\n  --surface-accent:  var(--cl-green);\n\n  /* Text */\n  --text-strong:   var(--cl-white);  /* headings, primary on dark */\n  --text-body:     var(--cl-pearl);  /* paragraphs on dark */\n  --text-muted:    var(--cl-mid);    /* captions, labels, meta */\n  --text-accent:   var(--cl-green);  /* links, accents, H3 */\n  --text-on-accent: var(--cl-night); /* text on green surfaces */\n\n  /* Lines */\n  --border-subtle: var(--cl-border);\n  --border-card:   var(--cl-border);\n}\n\n/* ============================================================\n   TYPOGRAPHY — CumbreLab\n   Display = Garet Bold (Nunito 800 stand-in): titles, CTAs, labels.\n   Body    = Alata Regular: paragraphs, captions, support text.\n   Caption style = display 800, UPPERCASE, wide tracking.\n   ============================================================ */\n:root {\n  /* Weights */\n  --fw-regular: 400; /* @kind font */\n  --fw-medium: 600; /* @kind font */\n  --fw-bold: 700; /* @kind font */\n  --fw-display: 800; /* @kind font */\n\n  /* Type scale (px) — from the brand manual's specimen */\n  --fs-display: 64px; /* hero / brand */\n  --fs-h1: 48px;\n  --fs-h2: 36px;\n  --fs-h3: 24px;\n  --fs-body-lg: 18px;\n  --fs-body: 16px;\n  --fs-small: 14px;\n  --fs-caption: 11px; /* uppercase label */\n\n  /* Line heights */\n  --lh-tight: 1.15; /* @kind font */\n  --lh-snug: 1.3; /* @kind font */\n  --lh-body: 1.7; /* @kind font */\n\n  /* Letter spacing */\n  --ls-caption: 0.12em; /* uppercase labels */\n  --ls-pill: 0.16em;    /* pill / section-label */\n  --ls-normal: 0; /* @kind font */\n\n  /* Semantic role tokens */\n  --text-display-family: var(--font-display);\n  --text-body-family: var(--font-body);\n}\n\n/* ============================================================\n   SPACING, RADIUS, SHADOW, MOTION — CumbreLab\n   ============================================================ */\n:root {\n  /* ---- Spacing scale (px) ---- */\n  --space-2: 2px;\n  --space-4: 4px;\n  --space-8: 8px;\n  --space-12: 12px;\n  --space-16: 16px;\n  --space-20: 20px;\n  --space-24: 24px;\n  --space-28: 28px; /* default card padding */\n  --space-32: 32px;\n  --space-40: 40px;\n  --space-48: 48px;\n  --space-56: 56px;\n  --space-64: 64px;\n  --space-96: 96px; /* section gap */\n\n  --section-gap: 96px;\n  --container: 1120px;\n\n  /* ---- Radius ---- */\n  --radius-sm: 4px;   /* tiny chips, swatch roles */\n  --radius: 8px;      /* base — cards, buttons-square, inputs */\n  --radius-lg: 12px;  /* large cards, app surfaces */\n  --radius-pill: 100px; /* pills, CTA buttons, capsules */\n  --radius-circle: 50%;\n\n  /* ---- Borders ---- */\n  --border-width: 1px;\n  --border-accent-width: 3px; /* left accent on quote cards / email sig */\n\n  /* ---- Shadows (used sparingly on dark; mostly menus/popovers) ---- */\n  --shadow-sm: 0 1px 4px rgba(0, 0, 0, 0.12);\n  --shadow-pop: 0 16px 48px rgba(0, 0, 0, 0.50); /* dropdown / dialog */\n  --shadow-glow: 0 0 0 1px var(--cl-green-20), 0 8px 32px rgba(168, 255, 176, 0.08);\n\n  /* ---- Motion ---- */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --dur-fast: 0.15s; /* @kind other */\n  --dur: 0.2s; /* @kind other */\n  /* Interaction model: hover = opacity 0.88 + translateY(-1px);\n     press = settle back; links = color → green. */\n  --hover-opacity: 0.88; /* @kind other */\n  --hover-lift: -1px; /* @kind other */\n}\n\n<\u002Fstyle>\n<style>/* cyrillic-ext */\n@font-face {\n  font-famil  {{ t.bd }};background:{{ t.bg }};color:{{ t.fg }}\">{{ t.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px\">\n      <sc-for list=\"{{ visible }}\" as=\"p\" hint-placeholder-count=\"6\">\n        <article style=\"border:1px solid #E3E7EF;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;background:#fff;transition:all .2s cubic-bezier(.16,1,.3,1)\" style-hover=\"transform:translateY(-3px);box-shadow:0 18px 40px rgba(14,31,77,.12)\">\n          <div style=\"position:relative;height:220px;background:#EEF1F6\">\n            <sc-if value=\"{{ p.hasImg }}\" hint-placeholder-val=\"{{ false }}\"><img src=\"{{ p.img }}\" alt=\"{{ p.title }}\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover\"><\u002Fsc-if><sc-if value=\"{{ p.noImg }}\" hint-placeholder-val=\"{{ true }}\"><image-slot id=\"{{ p.slot }}\" placeholder=\"{{ p.ph }}\" style=\"position:absolute;inset:0;width:100%;height:100%\"><\u002Fimage-slot><\u002Fsc-if>\n            <span style=\"position:absolute;top:14px;left:14px;font-family:'Montserrat';font-weight:800;font-size:11px;letter-spacing:.12em;color:#fff;background:#0E1F4D;border-radius:100px;padding:6px 12px;pointer-events:none\">{{ p.opLabel }}<\u002Fspan>\n            <span style=\"position:absolute;top:14px;right:14px;display:flex;align-items:center;gap:5px;font-family:'Montserrat';font-weight:800;font-size:11px;color:#0A47C2;background:#fff;border-radius:100px;padding:6px 11px;pointer-events:none\"><svg sc-camel-view-box=\"0 0 24 24\" style=\"width:14px;height:14px\"><use href=\"#ic-check\"><\u002Fuse><\u002Fsvg>Verificada<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:20px 22px 22px;display:flex;flex-direction:column;gap:10px;flex:1\">\n            <span style=\"display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#6B7590\"><svg sc-camel-view-box=\"0 0 24 24\" style=\"width:16px;height:16px;color:#E1251B\"><use href=\"#ic-pin\"><\u002Fuse><\u002Fsvg>{{ p.place }}<\u002Fspan>\n            <h3 style=\"margin:0;font-family:'Montserrat';font-weight:800;font-size:19px;line-height:1.25;color:#0E1F4D\">{{ p.title }}<\u002Fh3>\n            <span style=\"font-size:14px;color:#2B3448\">{{ p.specs }}<\u002Fspan>\n            <div style=\"margin-top:auto;padding-top:14px;border-top:1px solid #E3E7EF;display:flex;justify-content:space-between;align-items:center\">\n              <span style=\"font-family:'Montserrat';font-weight:900;font-size:22px;color:#0E1F4D\">{{ p.price }}<\u002Fspan>\n              <span style=\"display:flex;gap:14px;align-items:center\"><sc-if value=\"{{ p.hasFicha }}\" hint-placeholder-val=\"{{ false }}\"><a href=\"{{ p.ficha }}\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'Montserrat';font-weight:800;font-size:13px;color:#0A47C2\">Ver ficha<\u002Fa><\u002Fsc-if><a href=\"{{ p.href }}\" target=\"{{ p.tgt }}\" style=\"font-family:'Montserrat';font-weight:800;font-size:13px;color:#E1251B\">Agendar visita →<\u002Fa><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <sc-if value=\"{{ isEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n      <p style=\"margin:0;font-size:16px;text-align:center;color:#6B7590\">Aún no tenemos publicadas propiedades de este tipo. <a href=\"#contacto\">Cuéntanos qué buscas<\u002Fa> y te avisamos primero.<\u002Fp>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"videos\" style=\"padding:96px 0;background:#EEF1F6;scroll-margin-top:72px\">\n  <div style=\"width:min(1200px,92%);margin:0 auto;display:flex;flex-direction:column;gap:32px\">\n    <div style=\"display:flex;flex-direction:column;gap:12px;max-width:640px\">\n      <span style=\"font-family:'Montserrat';font-weight:800;font-size:12px;letter-spacing:.2em;color:#E1251B\">CONÓCENOS EN VIDEO<\u002Fspan>\n      <h2 style=\"margin:0;font-family:'Montserrat';font-weight:800;font-size:clamp(30px,4vw,44px);line-height:1.05;letter-spacing:-0.02em;color:#0E1F4D\">Quiénes somos, con quién trabajamos y qué nos mueve.<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px\">\n      <article style=\"background:#fff;border:1px solid #E3E7EF;border-radius:16px;overflow:hidden;display:flex;flex-direction:column\">\n        <div style=\"position:relative;background:#0E1F4D;aspect-ratio:9/14;overflow:hidden\">\n          <iframe src=\"https://www.instagram.com/reel/DfcTB8rhjD3/embed/\" title=\"Esto es Click\" loading=\"lazy\" allowfullscreen=\"\" style=\"position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff\"><\u002Fiframe>\n        <\u002Fdiv>\n        <div style=\"padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px\">\n          <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-family:'Montserrat';font-weight:800;font-size:11px;letter-spacing:.16em;color:#E1251B\">PRESENTACIÓN<\u002Fspan><span style=\"font-family:'Montserrat';font-weight:800;font-size:17px;color:#0E1F4D\">Esto es Click<\u002Fspan><\u002Fdiv>\n          <a href=\"https://www.instagram.com/reel/DfcTB8rhjD3/\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'Montserrat';font-weight:800;font-size:13px;color:#0A47C2;white-space:nowrap\">Ver en Instagram →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Farticle>\n      <article style=\"background:#fff;border:1px solid #E3E7EF;border-radius:16px;overflow:hidden;display:flex;flex-direction:column\">\n        <div style=\"position:relative;background:#0E1F4D;aspect-ratio:9/14;overflow:hidden\">\n          <iframe src=\"https://www.instagram.com/reel/Dfiba2_NhqD/embed/\" title=\"Juntos llegamos más lejos\" loading=\"lazy\" allowfullscreen=\"\" style=\"position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff\"><\u002Fiframe>\n        <\u002Fdiv>\n        <div style=\"padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px\">\n          <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-family:'Montserrat';font-weight:800;font-size:11px;letter-spacing:.16em;color:#E1251B\">ALIANZA ESTRATÉGICA<\u002Fspan><span style=\"font-family:'Montserrat';font-weight:800;font-size:17px;color:#0E1F4D\">Juntos llegamos más lejos<\u002Fspan><\u002Fdiv>\n          <a href=\"https://www.instagram.com/reel/Dfiba2_NhqD/\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'Montserrat';font-weight:800;font-size:13px;color:#0A47C2;white-space:nowrap\">Ver en Instagram →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Farticle>\n      <article style=\"background:#fff;border:1px solid #E3E7EF;border-radius:16px;overflow:hidden;display:flex;flex-direction:column\">\n        <div style=\"position:relative;background:#0E1F4D;aspect-ratio:9/14;overflow:hidden\">\n          <iframe src=\"https://www.instagram.com/reel/Dfk4XZkvWYu/embed/\" title=\"Lo que nos mueve\" loading=\"lazy\" allowfullscreen=\"\" style=\"position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff\"><\u002Fiframe>\n        <\u002Fdiv>\n        <div style=\"padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px\">\n          <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-family:'Montserrat';font-weight:800;font-size:11px;letter-spacing:.16em;color:#E1251B\">FILOSOFÍA<\u002Fspan><span style=\"font-family:'Montserrat';font-weight:800;font-size:17px;color:#0E1F4D\">Lo que nos mueve<\u002Fspan><\u002Fdiv>\n          <a href=\"https://www.instagram.com/reel/Dfk4XZkvWYu/\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'Montserrat';font-weight:800;font-size:13px;color:#0A47C2;white-space:nowrap\">Ver en Instagram →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"servicios\" style=\"background:#0E1F4D;color:#fff;padding:96px 0\">\n  <div style=\"width:min(1200px,92%);margin:0 auto;display:flex;flex-direction:column;gap:48px\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:40px;align-items:end\">\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <span style=\"font-family:'Montserrat';font-weight:800;font-size:12px;letter-spacing:.2em;color:#FF8A84\">POR QUÉ CLICK<\u002Fspan>\n        <h2 style=\"margin:0;font-family:'Montserrat';font-weight:800;font-size:clamp(30px,4vw,46px);line-height:1.05;letter-spacing:-0.02em;text-wrap:balance\">No somos solo una inmobiliaria. Somos un centro de negocios.<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:17px;line-height:1.7;color:#C8D3EE;text-wrap:pretty\">Donde otros solo publican anuncios, Click resuelve toda la operación. Un mismo asesor coordina cada paso, con equipo legal y financiero en la misma oficina.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:2px;background:rgba(255,255,255,.08);border-radius:14px;overflow:hidden\">\n      <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"6\">\n        <div style=\"background:#0E1F4D;padding:28px 22px;display:flex;flex-direction:column;gap:14px;transition:background .2s\" style-hover=\"background:#13286A\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center\"><span style=\"width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;color:#fff\"><svg sc-camel-view-box=\"0 0 24 24\" style=\"width:24px;height:24px\"><use href=\"{{ s.icon }}\"><\u002Fuse><\u002Fsvg><\u002Fspan><span style=\"font-family:'Montserrat';font-weight:900;font-size:13px;color:#FF8A84\">{{ s.n }}<\u002Fspan><\u002Fdiv>\n          <span style=\"font-family:'Montserrat';font-weight:800;font-size:17px\">{{ s.title }}<\u002Fspan>\n          <span style=\"font-size:14px;line-height:1.6;color:#C8D3EE\">{{ s.text }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px\">\n      <div style=\"display:flex;flex-direction:column;gap:8px;border-top:2px solid #E1251B;padding-top:18px\"><span style=\"font-family:'Montserrat';font-weight:800;font-size:17px\">Raíces locales<\u002Fspan><span style=\"font-size:14.5px;line-height:1.65;color:#C8D3EE\">Conocemos Otavalo e Imbabura: barrios, haciendas y dónde crece de verdad la plusvalía.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px;border-top:2px solid #E1251B;padding-top:18px\"><span style=\"font-family:'Montserrat';font-weight:800;font-size:17px\">Comisiones claras<\u002Fspan><span style=\"font-size:14.5px;line-height:1.65;color:#C8D3EE\">Precios sustentados en estudio de mercado y condiciones por escrito desde el primer día.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px;border-top:2px solid #E1251B;padding-top:18px\"><span style=\"font-family:'Montserrat';font-weight:800;font-size:17px\">Alianzas estratégicas<\u002Fspan><span style=\"font-size:14.5px;line-height:1.65;color:#C8D3EE\">Financieras, constructoras e inmobiliarias aliadas que abren más opciones para ti.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"vender\" style=\"padding:96px 0;background:#EEF1F6\">\n  <div style=\"width:min(1200px,92%);margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:48px;align-items:center\">\n    <div style=\"display:flex;flex-direction:column;gap:20px\">\n      <span style=\"font-family:'Montserrat';font-weight:800;font-size:12px;letter-spacing:.2em;color:#E1251B\">¿QUIERES VENDER O ARRENDAR?<\u002Fspan>\n      <h2 style=\"mar do', 'Negociación', 'Defendemos tu interés hasta firmar en notaría.'],\n      ['#ic-llave', 'Entrega de llaves', 'Te acompañamos hasta el último papel.']\n    ].map(([icon, title, text], i) => ({ icon, title, text, n: '0' + (i + 1) }));\n    return {\n      ops, tabs, visible, steps, isEmpty: visible.length === 0,\n      searchType: s.searchType,\n      onType: e => this.setState({ searchType: e.target.value }),\n      onSearch: () => {\n        this.setState({ filter: s.searchType });\n        const el = this.listRef.current;\n        if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 72, behavior: 'smooth' });\n      },\n      listRef: this.listRef,\n      name: s.name, onName: e => this.setState({ name: e.target.value }),\n      firstName: (s.name.trim().split(' ')[0]) || 'gracias',\n      sent: s.sent, notSent: !s.sent,\n      submit: () => this.setState({ sent: true }), reset: () => this.setState({ sent: false, name: '' }),\n      price: s.price, down: s.down, years: s.years, rate: s.rate,\n      onPrice: e => this.setState({ price: +e.target.value }),\n      onDown: e => this.setState({ down: +e.target.value }),\n      onYears: e => this.setState({ years: +e.target.value }),\n      onRate: e => this.setState({ rate: +e.target.value }),\n      simPrice: this.money(s.price), simDown: s.down + '% · ' + this.money(s.price * s.down / 100),\n      simYears: s.years + ' años', simRate: s.rate.toFixed(2).replace('.', ',') + '%',\n      simLoan: this.money(loan), simQuota: this.money(quota),\n      showSim: this.props.showSimulator ?? true,\n      showWa: this.props.floatingWhatsapp ?? true\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
